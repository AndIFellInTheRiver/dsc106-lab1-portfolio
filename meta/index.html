<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>

    <title>Code Analysis</title>
</head>

<body>
    <h1>Code Analysis</h1>

    <p>This page explores statistics about the code and Git history of my portfolio website.</p>

    <!--time filter-->
    <div class="commit-filter">
        <label for="commit-progress">Show commits until:</label>
        <input type="range" id="commit-progress" min="0" max="100" value="100" step="0.1">
        <time id="commit-time"></time>
    </div>

    <div id="stats"></div>

    <!--scroll-based narrative-->
    <h2>Commits by time of day</h2>
    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <!--file size unit visualization-->
    <h2>File sizes over time</h2>
    <p>Each dot represents one line of code recorded in a commit. Colors indicate file type.</p>
    <div id="scrolly-2">
        <div id="file-story"></div>
        <div id="file-plot">
            <dl id="files"></dl>
        </div>
    </div>

    <!--commit tooltip-->
    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="tooltip-commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>
</body>

</html>
